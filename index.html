<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Erafone Maros M114</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .bg-navy { background-color: #0f172a; }
    .text-navy { color: #0f172a; }
    
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.1); }
    }
    .blink-alert { animation: blink 0.8s infinite; color: #ef4444; font-weight: 800; }

    .status-badge {
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
    }
    .status-updated { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .status-stale { background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
  </style>
</head>

<body class="min-h-screen text-slate-900">

<div id="loginModal" class="fixed inset-0 bg-slate-900/95 flex items-center justify-center z-50 backdrop-blur-md">
  <div class="bg-white rounded-3xl p-8 w-[90%] max-w-sm shadow-2xl">
    <h2 class="text-2xl font-bold text-center text-navy mb-6">Erafone M114</h2>
    <form id="loginForm" class="space-y-4">
      <input id="nama" type="text" placeholder="Nama Anda" class="w-full bg-slate-50 border rounded-xl px-4 py-4 outline-none focus:ring-2 focus:ring-navy" required>
      <input id="password" type="password" placeholder="Password" class="w-full bg-slate-50 border rounded-xl px-4 py-4 outline-none focus:ring-2 focus:ring-navy" required>
      <button class="w-full bg-navy text-white py-4 rounded-xl font-bold shadow-lg hover:bg-slate-800 transition-all">MASUK</button>
    </form>
  </div>
</div>

<header class="sticky top-0 z-40 bg-navy text-white shadow-xl">
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center px-6 py-4 gap-4">
    <div>
        <h1 class="text-xl font-black italic tracking-tight">ERAFONE MAROS M114</h1>
        <div class="flex items-center gap-2 mt-1">
            <span id="status-label" class="status-badge status-updated">Menghubungkan...</span>
            <span id="last-check-time" class="text-[9px] text-slate-400 font-medium"></span>
        </div>
    </div>
    <div id="user-display" class="hidden flex items-center gap-3">
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Petugas:</span>
        <span id="user-name" class="text-sm font-bold bg-white/10 px-3 py-1 rounded-lg border border-white/20 text-white"></span>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto p-4 md:p-8">
  <div class="mb-8 relative">
    <input id="search-bar" type="text" placeholder="Cari unit handphone..." class="w-full bg-white border border-slate-200 rounded-2xl pl-6 pr-4 py-4 shadow-sm focus:ring-2 focus:ring-navy outline-none font-medium" oninput="filterItems()">
  </div>

  <div class="hidden md:block overflow-hidden bg-white rounded-3xl shadow-xl border border-slate-100">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-50 border-b text-navy uppercase text-[11px] font-extrabold tracking-wider">
        <tr>
          <th class="px-8 py-5 text-left">ID Material</th>
          <th class="px-8 py-5 text-left">Deskripsi Produk</th>
          <th class="px-8 py-4 text-center">Masuk</th>
          <th class="px-8 py-4 text-center">Keluar</th>
          <th class="px-8 py-4 text-center">Sisa Stok</th>
        </tr>
      </thead>
      <tbody id="tabel-desktop" class="divide-y divide-slate-50">
        </tbody>
    </table>
  </div>

  <div id="tabel-mobile" class="md:hidden space-y-4"></div>
</main>

<script>
const PASSWORD_BENAR = "m114";
const NAMA_DIIJINKAN = ["Dion","Ali","Wira","Awa","Hilda","Dilla","icha","anna","cici"];
const url = `https://docs.google.com/spreadsheets/d/11xtV-IQl-gD7X1nmAdT52u3XomF_7DT0hNJRyZj2hs4/gviz/tq?tqx=out:json&sheet=Sheet1`;

let lastDataHash = localStorage.getItem('lastDataHash') || "";
let lastChangeTimestamp = localStorage.getItem('lastChangeTimestamp') || Date.now();

document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const namaInput = document.getElementById("nama").value.trim();
  const passInput = document.getElementById("password").value;
  
  const userValid = NAMA_DIIJINKAN.find(u => u.toLowerCase() === namaInput.toLowerCase());

  if (passInput === PASSWORD_BENAR && userValid) {
    document.getElementById("user-name").textContent = userValid.toUpperCase();
    document.getElementById("user-display").classList.remove("hidden");
    document.getElementById("loginModal").classList.add("hidden");
    loadData();
    // Cek perubahan setiap 1 menit (tanpa refresh tampilan jika tidak ada perubahan)
    setInterval(loadData, 60000); 
  } else {
    alert("Nama atau Password salah!");
  }
});

function loadData() {
  fetch(url)
    .then(res => res.text())
    .then(data => {
      const currentHash = data;
      const json = JSON.parse(data.substr(47).slice(0, -2));
      
      // Jika ada perubahan data dari sebelumnya
      if (currentHash !== lastDataHash) {
        lastDataHash = currentHash;
        lastChangeTimestamp = Date.now();
        
        // Simpan ke storage agar saat web dibuka lagi data "2 jam" tetap akurat
        localStorage.setItem('lastDataHash', currentHash);
        localStorage.setItem('lastChangeTimestamp', lastChangeTimestamp);
        
        renderData(json.table.rows);
        updateStatusUI(true);
      } else {
        // Jika tidak ada perubahan, cek apakah sudah lewat 2 jam
        if (tabelDesktop.innerHTML === "") renderData(json.table.rows); // Pastikan data tetap muncul di awal
        checkStaleStatus();
      }

      document.getElementById("last-check-time").textContent = "Update sistem: " + new Date().toLocaleTimeString('id-ID');
    });
}

function renderData(rows) {
  const tableBody = document.getElementById("tabel-desktop");
  const mobileBody = document.getElementById("tabel-mobile");
  tableBody.innerHTML = "";
  mobileBody.innerHTML = "";

  rows.forEach(r => {
    const c = r.c;
    const masuk = c[2]?.v || 0;
    const keluar = c[3]?.v || 0;
    const total = masuk - keluar;
    const isBlink = total === 1 ? 'blink-alert' : 'font-bold text-navy';

    tableBody.innerHTML += `
      <tr class="hover:bg-slate-50 transition-colors">
        <td class="px-8 py-4 text-xs text-slate-400 font-mono">${c[0]?.v || "-"}</td>
        <td class="px-8 py-4 font-bold text-navy uppercase text-xs">${c[1]?.v || "-"}</td>
        <td class="px-8 py-4 text-center font-semibold text-slate-600">${masuk}</td>
        <td class="px-8 py-4 text-center font-semibold text-slate-600">${keluar}</td>
        <td class="px-8 py-4 text-center"><span class="${isBlink} bg-slate-100 px-3 py-1 rounded-lg">${total}</span></td>
      </tr>`;

    mobileBody.innerHTML += `
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <div class="text-[9px] text-slate-300 font-bold mb-1 font-mono">${c[0]?.v || "-"}</div>
        <div class="font-extrabold text-navy mb-4 leading-tight">${c[1]?.v || "-"}</div>
        <div class="flex justify-between text-center border-t border-slate-50 pt-4">
          <div><p class="text-[9px] text-slate-400 uppercase font-bold">Masuk</p><p class="font-bold text-slate-700">${masuk}</p></div>
          <div class="border-x border-slate-100 px-4"><p class="text-[9px] text-slate-400 uppercase font-bold">Keluar</p><p class="font-bold text-slate-700">${keluar}</p></div>
          <div><p class="text-[9px] text-slate-400 uppercase font-bold">Sisa</p><p class="${isBlink}">${total}</p></div>
        </div>
      </div>`;
  });
}

function updateStatusUI(isNew) {
  const label = document.getElementById("status-label");
  if (isNew) {
    label.textContent = "Sudah Diperbarui";
    label.className = "status-badge status-updated";
  }
}

function checkStaleStatus() {
  const label = document.getElementById("status-label");
  const twoHours = 2 * 60 * 60 * 1000; // 2 Jam dalam milidetik
  const timePassed = Date.now() - lastChangeTimestamp;

  if (timePassed > twoHours) {
    label.textContent = "Belum Diperbarui";
    label.className = "status-badge status-stale";
  } else {
    label.textContent = "Sudah Diperbarui";
    label.className = "status-badge status-updated";
  }
}

function filterItems() {
  const q = document.getElementById("search-bar").value.toLowerCase();
  [...document.getElementById("tabel-desktop").rows].forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? "" : "none");
  [...document.getElementById("tabel-mobile").children].forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? "" : "none");
}
</script>
</body>
</html>
