<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Erafone Maros M114</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .bg-navy { background-color: #0f172a; }
    .text-navy { color: #0f172a; }
    
    /* Animasi Kedap-Kedip Stok Sisa 1 */
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.1); }
    }
    .blink-alert { animation: blink 0.8s infinite; color: #ef4444; font-weight: 800; }

    /* Badge Status */
    .status-badge {
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-updated { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .status-stale { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
  </style>
</head>

<body class="min-h-screen text-slate-900">

<div id="loginModal" class="fixed inset-0 bg-slate-900/95 flex items-center justify-center z-50 backdrop-blur-md">
  <div class="bg-white rounded-3xl p-8 w-[90%] max-w-sm shadow-2xl">
    <div class="flex justify-center mb-6">
        <div class="w-16 h-16 bg-navy rounded-2xl flex items-center justify-center shadow-lg text-white text-2xl font-bold">E</div>
    </div>
    <h2 class="text-2xl font-bold text-center text-navy mb-2 italic">ERAFONE M114</h2>
    <p class="text-slate-400 text-center text-xs mb-8 uppercase tracking-widest">Internal Stock System</p>
    <form id="loginForm" class="space-y-4">
      <input id="nama" type="text" placeholder="Username" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 outline-none focus:ring-2 focus:ring-navy transition-all" required>
      <input id="password" type="password" placeholder="Password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 outline-none focus:ring-2 focus:ring-navy transition-all" required>
      <button class="w-full bg-navy text-white py-4 rounded-xl font-bold shadow-lg hover:bg-slate-800 active:scale-95 transition-all">LOG IN</button>
    </form>
  </div>
</div>

<header class="sticky top-0 z-40 bg-navy text-white shadow-xl">
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center px-6 py-4 gap-4">
    <div>
        <h1 class="text-xl font-black italic tracking-tight uppercase">Erafone Maros M114</h1>
        <div class="flex items-center gap-2 mt-1">
            <span id="status-label" class="status-badge status-updated">Sinkronisasi...</span>
            <span id="update-time-display" class="text-[10px] text-slate-400 font-bold uppercase tracking-wider"></span>
        </div>
    </div>
    <div id="user-display" class="hidden flex items-center gap-3">
        <span id="user-name" class="text-sm font-bold bg-white/10 px-4 py-2 rounded-lg border border-white/20 text-white"></span>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto p-4 md:p-8">
  <div class="mb-8 relative">
    <input id="search-bar" type="text" placeholder="Cari tipe handphone..." class="w-full bg-white border border-slate-200 rounded-2xl pl-6 pr-4 py-4 shadow-sm focus:ring-2 focus:ring-navy outline-none font-medium" oninput="filterItems()">
  </div>

  <div class="hidden md:block overflow-hidden bg-white rounded-3xl shadow-xl border border-slate-100">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-50 border-b text-navy uppercase text-[11px] font-extrabold tracking-wider">
        <tr>
          <th class="px-8 py-5 text-left">ID Material</th>
          <th class="px-8 py-5 text-left">Deskripsi Produk</th>
          <th class="px-8 py-4 text-center">Masuk</th>
          <th class="px-8 py-4 text-center">Keluar</th>
          <th class="px-8 py-4 text-center">Sisa Stok</th>
        </tr>
      </thead>
      <tbody id="tabel-desktop" class="divide-y divide-slate-50">
        </tbody>
    </table>
  </div>

  <div id="tabel-mobile" class="md:hidden space-y-4"></div>
</main>

<script>
/* ===== SETTINGS ===== */
const PASSWORD_BENAR = "m114";
const NAMA_DIIJINKAN = ["Dion","Ali","Wira","Awa","Hilda","Dilla","icha","anna","cici"];
const url = `https://docs.google.com/spreadsheets/d/11xtV-IQl-gD7X1nmAdT52u3XomF_7DT0hNJRyZj2hs4/gviz/tq?tqx=out:json&sheet=Sheet1`;

/* ===== STATE MANAGEMENT ===== */
let lastDataHash = localStorage.getItem('lastDataHash_M114') || "";
let lastChangeTimestamp = localStorage.getItem('lastChangeTimestamp_M114') || null;
let lastChangeTimeDisplay = localStorage.getItem('lastChangeTimeDisplay_M114') || "-";

document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const namaInput = document.getElementById("nama").value.trim();
  const userValid = NAMA_DIIJINKAN.find(u => u.toLowerCase() === namaInput.toLowerCase());

  if (document.getElementById("password").value === PASSWORD_BENAR && userValid) {
    document.getElementById("user-name").textContent = "USER: " + userValid.toUpperCase();
    document.getElementById("user-display").classList.remove("hidden");
    document.getElementById("loginModal").classList.add("hidden");
    
    loadData();
    setInterval(loadData, 60000); // Cek background setiap 1 menit
    setInterval(checkStaleStatus, 10000); // Cek status badge tiap 10 detik
  } else {
    alert("Data Login Salah!");
  }
});

function loadData() {
  fetch(url)
    .then(res => res.text())
    .then(data => {
      const currentHash = data;
      const json = JSON.parse(data.substr(47).slice(0, -2));

      // LOGIKA: Update jam HANYA jika hash data BERBEDA dengan yang terakhir disimpan
      // Jika lastDataHash kosong (login pertama kali), kita simpan tanpa menganggap "baru saja diubah"
      if (lastDataHash !== "" && currentHash !== lastDataHash) {
        lastChangeTimestamp = Date.now();
        lastChangeTimeDisplay = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        
        localStorage.setItem('lastChangeTimestamp_M114', lastChangeTimestamp);
        localStorage.setItem('lastChangeTimeDisplay_M114', lastChangeTimeDisplay);
      } 
      
      // Kondisi jika aplikasi benar-benar baru pertama kali dibuka di HP tersebut
      if (!lastChangeTimestamp) {
        lastChangeTimestamp = Date.now();
        lastChangeTimeDisplay = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        localStorage.setItem('lastChangeTimestamp_M114', lastChangeTimestamp);
        localStorage.setItem('lastChangeTimeDisplay_M114', lastChangeTimeDisplay);
      }

      lastDataHash = currentHash;
      localStorage.setItem('lastDataHash_M114', currentHash);

      renderData(json.table.rows);
      checkStaleStatus();
    });
}

function checkStaleStatus() {
  const label = document.getElementById("status-label");
  const timeText = document.getElementById("update-time-display");
  
  if (!lastChangeTimestamp) return;

  const now = Date.now();
  const twoHours = 2 * 60 * 60 * 1000;
  const timePassed = now - parseInt(lastChangeTimestamp);

  if (timePassed > twoHours) {
    label.textContent = "Belum Diperbarui";
    label.className = "status-badge status-stale";
  } else {
    label.textContent = "Sudah Diperbarui";
    label.className = "status-badge status-updated";
  }

  timeText.textContent = "Update: " + lastChangeTimeDisplay;
}

function renderData(rows) {
  const tableBody = document.getElementById("tabel-desktop");
  const mobileBody = document.getElementById("tabel-mobile");
  tableBody.innerHTML = "";
  mobileBody.innerHTML = "";

  rows.forEach(r => {
    const c = r.c;
    const masuk = c[2]?.v || 0;
    const keluar = c[3]?.v || 0;
    const total = masuk - keluar;
    const isBlink = total === 1 ? 'blink-alert' : 'font-bold text-navy';

    tableBody.innerHTML += `
      <tr class="hover:bg-slate-50 transition-colors">
        <td class="px-8 py-4 text-xs text-slate-400 font-mono">${c[0]?.v || "-"}</td>
        <td class="px-8 py-4 font-bold text-navy uppercase text-xs">${c[1]?.v || "-"}</td>
        <td class="px-8 py-4 text-center font-medium text-slate-500">${masuk}</td>
        <td class="px-8 py-4 text-center font-medium text-slate-500">${keluar}</td>
        <td class="px-8 py-4 text-center"><span class="${isBlink} bg-slate-100 px-4 py-1.5 rounded-lg border border-slate-200">${total}</span></td>
      </tr>`;

    mobileBody.innerHTML += `
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
        <div class="text-[9px] text-slate-300 font-bold mb-1 font-mono tracking-tighter">${c[0]?.v || "-"}</div>
        <div class="font-extrabold text-navy text-base mb-4 leading-tight">${c[1]?.v || "-"}</div>
        <div class="grid grid-cols-3 gap-4 border-t border-slate-50 pt-4">
          <div class="text-center">
            <p class="text-[9px] text-slate-400 uppercase font-bold">In</p>
            <p class="font-bold text-slate-700">${masuk}</p>
          </div>
          <div class="text-center border-x border-slate-100">
            <p class="text-[9px] text-slate-400 uppercase font-bold">Out</p>
            <p class="font-bold text-slate-700">${keluar}</p>
          </div>
          <div class="text-center">
            <p class="text-[9px] text-slate-400 uppercase font-bold">Stok</p>
            <p class="${isBlink} text-lg">${total}</p>
          </div>
        </div>
      </div>`;
  });
}

function filterItems() {
  const q = document.getElementById("search-bar").value.toLowerCase();
  [...document.getElementById("tabel-desktop").rows].forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? "" : "none");
  [...document.getElementById("tabel-mobile").children].forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? "" : "none");
}
</script>
</body>
</html>
